<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Opening Bonehead Labs…</title>
    <script>
      (function () {
        var path = window.location.pathname;
        if (path.startsWith("/BoneheadLabsSite/"))
          path = path.slice("/BoneheadLabsSite".length);
        window.location.replace(
          "/?__route=" +
            encodeURIComponent(
              path + window.location.search + window.location.hash,
            ),
        );
      })();
    </script>
  </head>
  <body>
    <p>Opening Bonehead Labs… <a href="/">Return to the studio</a>.</p>
  </body>
</html>
