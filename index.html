    <script>
      // Recover links redirected by GitHub Pages, including legacy hash-router URLs.
      (function () {
        var url = new URL(window.location.href);
        var route = url.searchParams.get("__route");
        if (route && route.startsWith("/") && !route.startsWith("//")) {
          window.history.replaceState(null, "", route);
        } else if (url.hash.startsWith("#/")) {
          window.history.replaceState(null, "", url.hash.slice(1));
        }
      })();
    </script>
